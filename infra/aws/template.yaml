AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MailDesk background schedules for an AWS Amplify deployment

Parameters:
  AppUrl:
    Type: String
    Description: Amplify production URL without a trailing slash
  CronSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Must exactly match CRON_SECRET configured in Amplify

Resources:
  MailDeskSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: maildesk-scheduler
      Description: Securely invokes the MailDesk background worker routes
      CodeUri: scheduler/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 60
      Environment:
        Variables:
          APP_URL: !Ref AppUrl
          CRON_SECRET: !Ref CronSecret
      Events:
        SendScheduledEmails:
          Type: Schedule
          Properties:
            Name: maildesk-send-scheduled
            Description: Dispatch due scheduled emails every five minutes
            Schedule: rate(1 minute)
            Enabled: true
            Input: '{"endpoint":"/api/cron/send-scheduled"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
        CheckFollowups:
          Type: Schedule
          Properties:
            Name: maildesk-check-followups
            Description: Create due follow-up reminders every fifteen minutes
            Schedule: rate(15 minutes)
            Enabled: true
            Input: '{"endpoint":"/api/cron/check-followups"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
  SchedulerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: MailDesk scheduler Lambda invocation errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref MailDeskSchedulerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  SchedulerFunctionName:
    Description: Lambda function invoked by EventBridge schedules
    Value: !Ref MailDeskSchedulerFunction
  SchedulerFunctionArn:
    Description: Scheduler Lambda ARN
    Value: !GetAtt MailDeskSchedulerFunction.Arn
